<script>
/* Auth fetch: attach JWT + auto-refresh on 401 (fixes mid-session logout / dead buttons) */
(function(){
  try {
    var F = window.fetch;
    var refreshing = null;
    function getAccess(){ try { return localStorage.getItem('access_token')||''; } catch(e){ return ''; } }
    function getRefresh(){ try { return localStorage.getItem('refresh_token')||''; } catch(e){ return ''; } }
    function setTokens(a,r){
      try {
        if(a) localStorage.setItem('access_token', a);
        if(r) localStorage.setItem('refresh_token', r);
      } catch(e){}
    }
    function apiBaseFrom(u){
      try {
        if(/^https?:\/\//i.test(u)){ var x=new URL(u); return x.origin; }
      } catch(e){}
      return (window.API_BASE||window.SERVER_URL||window.BASE_URL||location.origin||'').replace(/\/$/,'');
    }
    function doRefresh(base){
      if(refreshing) return refreshing;
      var rt = getRefresh();
      if(!rt) return Promise.reject(new Error('no refresh'));
      refreshing = F.call(window, (base||location.origin) + '/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: rt })
      }).then(function(res){
        return res.json().then(function(d){ return { ok: res.ok, d: d }; });
      }).then(function(x){
        refreshing = null;
        if(!x.ok || !(x.d.accessToken||x.d.access_token)) throw new Error('refresh failed');
        var a = x.d.accessToken || x.d.access_token;
        var r = x.d.refreshToken || x.d.refresh_token || rt;
        setTokens(a, r);
        return a;
      }).catch(function(e){ refreshing = null; throw e; });
      return refreshing;
    }
    window.fetch = function(input, init){
      init = init || {};
      var url = typeof input === 'string' ? input : ((input && input.url) || '');
      var isApi = url.indexOf('/api/') !== -1;
      var isRefresh = url.indexOf('/api/auth/refresh') !== -1;
      if(isApi && !isRefresh){
        try {
          var t = getAccess();
          if(t){
            var h = new Headers(init.headers || {});
            if(!h.has('Authorization')) h.set('Authorization', 'Bearer ' + t);
            init.headers = h;
          }
        } catch(e){}
      }
      return F.call(this, input, init).then(function(res){
        if(!isApi || isRefresh || res.status !== 401) return res;
        var base = apiBaseFrom(url);
        return doRefresh(base).then(function(newTok){
          var h2 = new Headers(init.headers || {});
          h2.set('Authorization', 'Bearer ' + newTok);
          init.headers = h2;
          return F.call(window, input, init);
        }).catch(function(){
          // refresh failed — only clear if both tokens bad; avoid aggressive logout loops
          return res;
        });
      });
    };
  } catch(e){}
})();
</script>

<script>
const BASE_URL='https://parents-control-website-lyqz.onrender.com';
const deviceId=new URLSearchParams(location.search).get('id');
const pageAccessToken=localStorage.getItem('access_token');

let nextCursorByType={images:null,videos:null},p2pPageByType={images:0,videos:0},pendingCandidates=[],queuedP2P=null,relayMode=false;

let cloudinaryUnlocked=true; // Default: unlocked
let totalP2PPhotosLoaded=0;
const DEFAULT_GALLERY_PAGE_SIZE=100;
const MAX_GALLERY_PAGE_SIZE=500;
function galleryPageSize(){if(galleryMaxPhotos>=99999)return MAX_GALLERY_PAGE_SIZE;return Math.max(1,Math.min(MAX_GALLERY_PAGE_SIZE,Number(galleryMaxPhotos)||DEFAULT_GALLERY_PAGE_SIZE))}
async function fetchGalleryLimits(){
  try{
    const token=localStorage.getItem('access_token');

      try{
        const subRes=await fetch(BASE_URL+'/api/subscription/status',{headers:{'Authorization':'Bearer '+token}});

          // from the admin-configured plan returned by /api/gallery-limits.

    const r=await fetch(BASE_URL+'/api/gallery-limits',{headers:{'Authorization':'Bearer '+(token||pageAccessToken)}});
    if(r.status===401){localStorage.removeItem('access_token');window.location.replace('/login');return}

    const d=await r.json();
    galleryMaxPhotos=typeof d.maxPhotos==='number'?d.maxPhotos:100;
    cloudinaryUnlocked=!!d.cloudinaryUnlocked;
    const planName=d.planName||'Free';
    const el=document.getElementById('planInfo');
    if(el)el.textContent='Plan: '+planName+' | Max photos: '+(galleryMaxPhotos>=99999?'Unlimited':galleryMaxPhotos)+(cloudinaryUnlocked?' | Cloudinary Backup: Active':'');

  }catch(e){debug('fetchGalleryLimits failed',e.message)}
}
function applyCloudinaryLock(){const btnP=document.getElementById('btnCloudPhotos');const btnV=document.getElementById('btnCloudVideos');if(!cloudinaryUnlocked){if(btnP){btnP.style.opacity='0.4';btnP.title='Cloudinary backup requires Plan 1999+';btnP.onclick=function(e){e.preventDefault();alert('Cloudinary backup/storage is only available on Plan 1999. Please upgrade your subscription.');return false}}if(btnV){btnV.style.opacity='0.4';btnV.title='Cloudinary backup requires Plan 1999+';btnV.onclick=function(e){e.preventDefault();alert('Cloudinary backup/storage is only available on Plan 1999. Please upgrade your subscription.');return false}}}else{if(btnP){btnP.style.opacity='1';btnP.title=''}if(btnV){btnV.style.opacity='1';btnV.title=''}}}
function updateLoadMoreVisibility(){const btn=document.getElementById('btnLoadMore');if(!btn)return;if(totalP2PPhotosLoaded>=galleryMaxPhotos){btn.style.display='none';debug('Load More hidden: limit reached ('+totalP2PPhotosLoaded+'/'+galleryMaxPhotos+')');return}btn.textContent='Load More ('+galleryPageSize()+')';btn.style.display='inline-flex'}
function setStatus(text,color){const el=document.getElementById('status');el.textContent=text;el.style.color=color||'var(--muted)'}
function debug(text,data){console.log('[Gallery]',text,data===undefined?'':data)}
function normalizeType(type){return type==='videos'?'videos':'images'}
function itemType(item){return item&&((item.type==='video')||String(item.mime||'').startsWith('video/'))?'videos':'images'}
function formatBytes(bytes){if(!Number.isFinite(bytes)||bytes<=0)return '0 B';const u=['B','KB','MB','GB','TB'];const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),u.length-1);return (bytes/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
async function updateStorageInfo(){try{if(!navigator.storage||!navigator.storage.estimate)return;const e=await navigator.storage.estimate();const el=document.getElementById('storageInfo');if(el)el.textContent='Parent browser cache: '+formatBytes(Number(e.usage||0))+' used / '+formatBytes(Number(e.quota||0))+' available quota'}catch(e){debug('storage estimate failed',e.message)}}
async function requestPersistentStorage(){try{if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();debug('persistent storage request',ok)}}catch(e){debug('persistent storage request failed',e.message)}}
function openDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('parents-control-gallery',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('items'))r.result.createObjectStore('items',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function dbPut(item){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});updateStorageInfo()}catch(e){debug('IndexedDB write failed',e.message);setStatus('Browser cache full; use Download or Cloudinary','var(--danger)')}}
async function dbGetAll(){try{const db=await openDb();return await new Promise((res,rej)=>{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}catch(e){debug('IndexedDB read failed',e.message);return []}}
async function dbDelete(id){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});updateStorageInfo()}catch(e){debug('IndexedDB delete failed',e.message)}}
async function dbClear(){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});updateStorageInfo()}catch(e){debug('IndexedDB clear failed',e.message)}}
function closePeer(){try{if(dc)dc.close()}catch(e){}try{if(pc)pc.close()}catch(e){}dc=null;pc=null}
// ── HMAC-SHA1 ICE credentials (same as child app) ──
async function hmacSha1Base64(secret,message){const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const sig=await crypto.subtle.sign('HMAC',key,enc.encode(message));return btoa(String.fromCharCode(...new Uint8Array(sig)))}
async function buildGalleryIceServers(){const expiry=Math.floor(Date.now()/1000)+24*3600;const username=expiry+':shadow';let credential='openrelayproject';try{credential=await hmacSha1Base64('openrelayprojectsecret',username)}catch(e){console.warn('[Gallery ICE] HMAC failed, using legacy',e)}return[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:openrelay.metered.ca:80'},{urls:'turn:openrelay.metered.ca:80',username,credential},{urls:'turn:openrelay.metered.ca:443',username,credential},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username,credential},{urls:'turns:openrelay.metered.ca:443',username,credential},{urls:'turn:staticauth.openrelay.metered.ca:80',username,credential},{urls:'turn:staticauth.openrelay.metered.ca:443',username,credential},{urls:'turn:staticauth.openrelay.metered.ca:443?transport=tcp',username,credential},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}
function initSocket(){if(socket||!deviceId)return;debug('opening Socket.IO connection',{deviceId});socket=io(BASE_URL,{transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>{debug('socket connected',{socketId:socket.id,type:activeMediaType});socket.emit('join-room',deviceId);socket.emit('join',deviceId);if(queuedP2P){const queued=queuedP2P;queuedP2P=null;setTimeout(()=>requestP2P(queued.type,queued.offset),250)}else if(autoSyncStage==='images'&&!requestId)requestP2P('images',0)});socket.on('connect_error',e=>{debug('socket connect error',e.message);setStatus('Signaling connection failed','var(--danger)')});socket.on('disconnect',reason=>debug('socket disconnected',reason));socket.on('gallery-offer',receiveOffer);socket.on('gallery-candidate',d=>{if(!d||d.requestId!==requestId||!d.candidate)return;const c=d.candidate;const iceInit={candidate:c.candidate||c.sdp||'',sdpMid:c.sdpMid||'0',sdpMLineIndex:c.sdpMLineIndex!=null?c.sdpMLineIndex:0};if(!pc||!pc.remoteDescription){pendingCandidates.push(iceInit);debug('ICE candidate queued until peer offer is ready');return}pc.addIceCandidate(iceInit).then(()=>debug('ICE candidate added')).catch(e=>debug('ICE candidate failed',e.message))});socket.on('gallery-error',d=>{debug('gallery signaling error',d);if(d&&d.requestId===requestId)triggerFallback(activeMediaType,'server error')});socket.on('gallery-fallback-complete',d=>{debug('Cloudinary save complete',d);const t=normalizeType(d&&d.mediaType||activeMediaType||'images');setStatus('Cloudinary saved '+(d&&d.uploaded!=null?d.uploaded:'')+' '+(t==='videos'?'videos':'photos')+' — loading…','var(--ok)');loadFallback(t,false)});socket.on('gallery-delete-ack',d=>{debug('delete acknowledgement',d);if(!pendingDelete)return;if((d.requestId&&d.requestId===pendingDelete.requestId)||(!d.requestId&&d.id===pendingDelete.id))pendingDelete.resolve(d)});socket.on('gallery-relay-start',d=>{debug('ignored gallery-relay-start — socket relay disabled');return;if(!d||d.requestId!==requestId)return;relayMode=true;clearTimeout(fallbackTimer);debug('relay mode activated',{requestId:d.requestId,type:activeMediaType});setStatus('Receiving '+(activeMediaType==='videos'?'videos':'photos')+' via server relay…','var(--ok)')});socket.on('gallery-relay-manifest',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'manifest',mediaType:d.mediaType,items:d.items})});socket.on('gallery-relay-file-start',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'file-start',id:d.id})});socket.on('gallery-relay-chunk',d=>{if(!d||d.requestId!==requestId||!relayMode||!d.chunk)return;handleRelayChunk(d.chunk)});socket.on('gallery-relay-file-end',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'file-end',id:d.id})});socket.on('gallery-relay-complete',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'gallery-complete'})})}
function requestP2P(type,offset){type=normalizeType(type);expectedGalleryIds=new Set();receivedGalleryIds=new Set();if(type==='videos'){setStatus('Videos are Cloudinary-only; P2P video disabled','var(--danger)');debug('P2P videos blocked');return}
// Always force a clean restart so Load More does not need a page refresh.
// Previous transfer may leave a half-open DataChannel / stale requestId on child.
if(requestId||pc||dc){
  try{if(socket&&socket.connected&&deviceId){socket.emit('stop_gallery',{target:deviceId,parentSocketId:socket.id,requestId:requestId});debug('stop_gallery before new P2P',{prev:requestId})}}catch(e){}
  closePeer();
  requestId=null;completedRequestId=null;relayMode=false;pendingCandidates=[];
}
if(!socket||!socket.connected){queuedP2P={type,offset:offset||0};debug('P2P request queued until Socket.IO connects',{type,offset:offset||0});setStatus('Waiting for P2P signaling connection…');initSocket();return}
const limit=Math.min(galleryPageSize(),Math.max(1,galleryMaxPhotos-(offset||0)));
activeMediaType=type;currentFilter=type;pendingCandidates=[];completedRequestId=null;relayMode=false;closePeer();
const startReq=()=>{
  requestId=crypto.randomUUID();clearTimeout(fallbackTimer);
  setStatus('Live P2P photos connecting…');
  debug('P2P request sent',{requestId,type,offset:offset||0,limit});
  socket.emit('gallery-request',{target:deviceId,requestId,mediaType:type,offset:offset||0,limit,parentSocketId:socket.id});
  // Prefer P2P: first timeout retries P2P once, only then falls back to socket relay
  fallbackTimer=setTimeout(()=>{
    if(relayMode||(dc&&dc.readyState==='open')||completedRequestId===requestId)return;
    debug('P2P first attempt timeout — retrying P2P once',{requestId,type});
    setStatus('P2P slow — retrying direct connection…');
    try{socket.emit('stop_gallery',{target:deviceId,parentSocketId:socket.id,requestId:requestId})}catch(e){}
    closePeer();pendingCandidates=[];
    const retryId=crypto.randomUUID();requestId=retryId;
    socket.emit('gallery-request',{target:deviceId,requestId:retryId,mediaType:type,offset:offset||0,limit,parentSocketId:socket.id});
    fallbackTimer=setTimeout(()=>{
      if(relayMode||(dc&&dc.readyState==='open')||completedRequestId===requestId)return;
      debug('P2P DataChannel timeout after retry — switching to server relay',{requestId,type});
      triggerFallback(type,'parent timeout waiting for DataChannel');
    },25000);
  },20000);
};
// Small delay so child can finish stop_gallery before new offer
setTimeout(startReq,700); // wait for child closePeer before new offer
}
function triggerFallback(type,reason){clearTimeout(fallbackTimer);closePeer();relayMode=false;debug('P2P failed — socket relay DISABLED, will keep retrying P2P only',{type,reason});setStatus('P2P failed ('+(reason||'')+'). Retrying direct P2P only (no socket)…','var(--danger)');
// Auto-retry P2P up to 3 times instead of socket relay
if(!window.__p2pRetryCount)window.__p2pRetryCount=0;
if(window.__p2pRetryCount<3){window.__p2pRetryCount++;const off=currentGalleryOffset||0;setTimeout(()=>{if(!relayMode)requestP2P(type||activeMediaType||'images',off)},1200);}
else{window.__p2pRetryCount=0;setStatus('P2P could not connect. Tap Load Photos / Load More to retry P2P.','var(--danger)');}
}
async function receiveOffer(d){if(!d||d.requestId!==requestId){debug('ignored stale offer',d&&d.requestId);return}debug('offer received',{requestId:d.requestId});try{closePeer();const iceServers=await buildGalleryIceServers();debug('ICE servers built count='+iceServers.length);pc=new RTCPeerConnection({iceServers:iceServers,sdpSemantics:'unified-plan',iceCandidatePoolSize:4});pc.onicecandidate=e=>{if(e.candidate){debug('sending ICE candidate');socket.emit('gallery-candidate',{targetSocketId:d.senderSocketId,requestId,candidate:{candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex}})}};pc.onconnectionstatechange=()=>{debug('peer connection state',pc.connectionState);if(['failed','closed'].includes(pc.connectionState)&&completedRequestId!==requestId)triggerFallback(activeMediaType,'browser peer state '+pc.connectionState)};pc.ondatachannel=e=>attachChannel(e.channel);await pc.setRemoteDescription({type:'offer',sdp:d.offer.sdp});for(const candidate of pendingCandidates.splice(0)){try{await pc.addIceCandidate(candidate);debug('queued ICE candidate added')}catch(e){debug('queued ICE candidate failed',e.message)}}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit('gallery-answer',{targetSocketId:d.senderSocketId,requestId,answer:{type:answer.type,sdp:answer.sdp}});debug('answer sent')}catch(e){debug('offer handling failed',e.message);triggerFallback(activeMediaType,'offer handling failed')}}
function attachChannel(channel){dc=channel;dc.binaryType='arraybuffer';debug('DataChannel attached',{state:channel.readyState});channel.onopen=()=>{clearTimeout(fallbackTimer);debug('DataChannel open');setStatus('Live P2P '+(activeMediaType==='videos'?'video':'photo')+' transfer active','var(--ok)')};channel.onclose=()=>{debug('DataChannel closed');/* do not force relay on close — Load More will open a fresh P2P */};channel.onerror=e=>{debug('DataChannel error',e&&e.message||'unknown');triggerFallback(activeMediaType,'channel error')};channel.onmessage=handleData}
function onP2PComplete(){
  const missing=[...expectedGalleryIds].filter(id=>!receivedGalleryIds.has(id));
  if(!relayMode && missing.length){
    debug('P2P completed with missing files; switching to server relay',{expected:expectedGalleryIds.size,received:receivedGalleryIds.size,missing:missing.length});
    setStatus('P2P finished with missing photos; retrying via secure relay…','var(--muted)');
    triggerFallback(activeMediaType,'missing files after P2P completion');
    return;
  }
  completedRequestId=requestId;isGalleryLoading=false;window.__p2pRetryCount=0;const photoCount=allPhotos.filter(x=>itemType(x)==='images').length;totalP2PPhotosLoaded=photoCount;debug('Transfer complete',{type:activeMediaType,count:photoCount,total:totalP2PPhotosLoaded,limit:galleryMaxPhotos});clearTimeout(fallbackTimer);p2pPageByType[activeMediaType]=(p2pPageByType[activeMediaType]||0)+1;setStatus((relayMode?'Relay':'P2P')+' photos loaded ('+totalP2PPhotosLoaded+'/'+(galleryMaxPhotos>=99999?'∞':galleryMaxPhotos)+')','var(--ok)');relayMode=false;closePeer();autoSyncStage='idle';updateLoadMoreVisibility()}
async function handleData(ev){
  // Decode control frames whether they arrive as string, Blob, or ArrayBuffer.
  // (Android binary flag bugs / browser differences can deliver text as binary.)
  if(ev.data instanceof ArrayBuffer){
    try{
      const text=new TextDecoder().decode(ev.data);
      if(text.trim().startsWith('{')) return handleData({data:text});
    }catch(e){debug('ArrayBuffer frame decode failed',e.message)}
    if(currentFile){currentFile.chunks.push(ev.data);return}
    return;
  }
  if(ev.data instanceof Blob){
    try {
      const text=await ev.data.text();
      if(text.trim().startsWith('{')) return handleData({data:text});
    } catch(e) { debug('Blob frame decode failed',e.message); }
    if(currentFile){currentFile.chunks.push(ev.data);return}
  }
  if(typeof ev.data==='string'){try{const m=JSON.parse(ev.data);debug('control frame',m.kind);if(m.kind==='manifest'){manifestById={};expectedGalleryIds=new Set((m.items||[]).map(x=>x.id));receivedGalleryIds=new Set();activeMediaType=normalizeType(m.mediaType||activeMediaType);(m.items||[]).forEach(x=>manifestById[x.id]=x);currentFilter=activeMediaType;setStatus('Receiving '+(activeMediaType==='videos'?'videos':'photos')+(relayMode?' via relay':' over P2P')+'…');debug('manifest received',{type:activeMediaType,count:(m.items||[]).length});renderGallery();return}if(m.kind==='file-start'){const meta=manifestById[m.id]||{};currentFile={...meta,id:m.id,chunks:[]};debug('file start',{id:m.id,name:m.name||meta.name});return}if(m.kind==='file-end'&&currentFile){const blob=new Blob(currentFile.chunks,{type:currentFile.mime||'application/octet-stream'});const old=allPhotos.find(x=>x.id===currentFile.id);if(old&&old.url&&old.source==='p2p')try{URL.revokeObjectURL(old.url)}catch(e){}const item={...currentFile,blob,source:'p2p',url:URL.createObjectURL(blob)};delete item.chunks;allPhotos=allPhotos.filter(x=>x.id!==item.id);allPhotos.push(item);receivedGalleryIds.add(item.id);dbPut({id:item.id,name:item.name,mime:item.mime,size:item.size,modifiedAt:item.modifiedAt,source:'p2p',blob});debug('file received',{id:item.id,name:item.name,bytes:blob.size,type:item.mime});renderGallery();currentFile=null;return}if(m.kind==='gallery-complete'){onP2PComplete();return}}catch(e){debug('control frame parse failed',e.message)}return}if(currentFile)currentFile.chunks.push(ev.data)}
function handleRelayMsg(msg){handleData({data:JSON.stringify(msg)})}
function handleRelayChunk(b64){try{const bin=atob(b64);const len=bin.length;const bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);handleData({data:bytes.buffer})}catch(e){debug('relay chunk decode failed',e.message)}}
async function loadGallery(type,automatic){type=normalizeType(type);currentFilter=type;autoSyncStage=automatic?'images':'idle';await fetchGalleryLimits();const cached=await dbGetAll();allPhotos=cached.filter(x=>x.blob instanceof Blob);for(const x of allPhotos)x.url=URL.createObjectURL(x.blob);renderGallery();updateStorageInfo();initSocket();activeMediaType=type;if(socket&&socket.connected)requestP2P(type)}
function syncP2P(type,more){type=normalizeType(type);if(type==='videos'){setStatus('Videos are Cloudinary-only (P2P disabled for heavy video)','var(--danger)');return}
// ── 500ms debounce on gallery buttons ──
const now=Date.now();if(now-lastGalleryBtnClick<500){debug('Gallery button debounce — ignoring rapid click');return}lastGalleryBtnClick=now;
// ── Subscription limit check ──
const pageSize=galleryPageSize();
const offset=more?(p2pPageByType[type]||0)*pageSize:0;
if(offset>=galleryMaxPhotos){setStatus('Photo limit reached for your plan ('+galleryMaxPhotos+'). Upgrade for more.','var(--danger)');debug('Subscription limit reached: offset='+offset+' max='+galleryMaxPhotos);return}
currentGalleryOffset=offset;
isGalleryLoading=true;
autoSyncStage='idle';currentFilter=type;if(!more){p2pPageByType[type]=0;totalP2PPhotosLoaded=0}renderGallery();requestP2P(type,offset)}
function loadMoreP2P(type){type=normalizeType(type);if(type==='videos')return;syncP2P(type,true)}
// ── Stop button: halt gallery transfer and reset state ──
function stopGalleryTransfer(){const now=Date.now();if(now-lastGalleryBtnClick<400)return;lastGalleryBtnClick=now;isGalleryLoading=false;window.__p2pRetryCount=0;try{if(socket&&socket.connected&&deviceId){socket.emit('stop_gallery',{target:deviceId,parentSocketId:socket.id,requestId:requestId});console.log('[Gallery] STOP clean',{target:deviceId,requestId})}else if(deviceId){initSocket();setTimeout(()=>{if(socket&&socket.connected)socket.emit('stop_gallery',{target:deviceId,parentSocketId:socket.id,requestId:requestId})},300)}}catch(e){console.warn('[Gallery] stop emit failed',e)}closePeer();clearTimeout(fallbackTimer);requestId=null;completedRequestId=null;relayMode=false;pendingCandidates=[];queuedP2P=null;setStatus('Gallery stopped — ready for new P2P','var(--ok)');debug('Stop complete — clean state')}
function refreshGallery(){renderGallery();updateStorageInfo();setStatus('Gallery refreshed — showing whatever is already loaded','var(--ok)');debug('manual refresh')}
function showAllMedia(){currentFilter='all';renderGallery();setStatus('Showing all loaded media; nothing was deleted','var(--ok)')}
function requestCloudinarySync(type){type=normalizeType(type);currentFilter=type;renderGallery();initSocket();if(!socket||!socket.connected)return setStatus('Child device is offline; Cloudinary save request not sent','var(--danger)');const cloudReq=crypto.randomUUID();setStatus('Saving '+(type==='videos'?'videos':'photos')+' to Cloudinary — wait, videos take time…');debug('Cloudinary save request sent',{requestId:cloudReq,type});socket.emit('gallery-fallback-request',{target:deviceId,requestId:cloudReq,mediaType:type});const poll=()=>loadFallback(type,false);setTimeout(poll,20000);setTimeout(poll,60000);setTimeout(poll,120000);setTimeout(poll,180000)}
async function loadFallback(type,more){type=type==='all'?'all':normalizeType(type);if(!deviceId)return;if(!more){if(type!=='all')nextCursorByType[type]=null;currentFilter=type}setStatus('Loading Cloudinary '+(type==='videos'?'videos':'photos')+'…');let url=BASE_URL+'/api/gallery-fallback-list/'+encodeURIComponent(deviceId);const q=[];if(type!=='all')q.push('media_type='+encodeURIComponent(type));const cursor=type==='all'?null:nextCursorByType[type];if(cursor)q.push('next_cursor='+encodeURIComponent(cursor));if(q.length)url+='?'+q.join('&');debug('Cloudinary list request',{type,url});try{const r=await fetch(url);const d=await r.json();for(const item of(d.photos||[])){const existing=allPhotos.find(x=>x.id===item.id);if(!existing)allPhotos.push(item);else if(existing.source!=='p2p'){Object.assign(existing,item)}}if(type!=='all')nextCursorByType[type]=d.next_cursor||null;renderGallery();setStatus('Cloudinary '+(type==='videos'?'videos':'photos')+' loaded; total visible '+allPhotos.filter(x=>type==='all'||itemType(x)===type).length);debug('Cloudinary list response',{type,count:(d.photos||[]).length,nextCursor:type==='all'?null:d.next_cursor||null})}catch(e){debug('Cloudinary list failed',e.message);setStatus('Cloudinary load failed','var(--danger)')}}
function loadMoreCloud(type){type=normalizeType(type);loadFallback(type,true)}
function renderGallery(){const root=document.getElementById('gallery');root.innerHTML='';const list=allPhotos.filter(x=>currentFilter==='all'||itemType(x)===currentFilter).sort((a,b)=>Number(b.modifiedAt||0)-Number(a.modifiedAt||0));for(const item of list){const card=document.createElement('div');card.className='gallery-item';const isVideo=itemType(item)==='videos';const media=isVideo?document.createElement('video'):document.createElement('img');media.className='gallery-img';media.src=item.url;media.loading='lazy';if(isVideo){media.muted=true;media.playsInline=true;media.preload='metadata'}card.onclick=()=>openModal(item);const del=document.createElement('button');del.className='delete-item';del.innerHTML='&times;';del.title='Delete original from child phone';del.onclick=async e=>{e.stopPropagation();await deleteItem(item)};const source=document.createElement('span');source.className='source-badge';source.textContent=item.source==='p2p'?'P2P live':'cloudinary';const typ=document.createElement('span');typ.className='type-badge';typ.textContent=isVideo?'VIDEO':'PHOTO';card.append(media,source,typ,del);root.appendChild(card)}if(!list.length){const empty=document.createElement('p');empty.style.gridColumn='1/-1';empty.style.color='var(--muted)';empty.textContent='No '+(currentFilter==='videos'?'videos':'photos')+' loaded yet.';root.appendChild(empty)}}
function waitForDeleteAck(req,id){return new Promise(resolve=>{const timeout=setTimeout(()=>{if(pendingDelete&&pendingDelete.requestId===req){pendingDelete=null;resolve({deleted:false,error:'Child did not confirm deletion'})}},15000);pendingDelete={requestId:req,id,resolve:d=>{clearTimeout(timeout);pendingDelete=null;resolve(d)}}})}
async function deleteItem(item){if(!confirm('Delete this item from the child phone and synced copies?'))return;initSocket();if(!socket||!socket.connected)return setStatus('Child device is offline; deletion was not sent','var(--danger)');const req=crypto.randomUUID();setStatus('Deleting original from child phone…');debug('delete request sent',{id:item.id,requestId:req,source:item.source});const ackPromise=waitForDeleteAck(req,item.id);socket.emit('gallery-delete',{target:deviceId,id:item.id,requestId:req,publicId:item.publicId||'',resourceType:item.resourceType||((item.mime||'').startsWith('video/')?'video':'image')});const ack=await ackPromise;const sourceOk=ack&&ack.sourceDeleted===true;const cloudOk=!item.publicId||ack&&ack.cloudinaryDeleted===true;const anyDeleted=sourceOk||cloudOk||(ack&&ack.deleted===true);if(!anyDeleted){debug('delete incomplete',ack);return setStatus('Delete incomplete: '+(ack&&ack.error||'child did not confirm'),'var(--danger)')}allPhotos=allPhotos.filter(x=>x.id!==item.id);await dbDelete(item.id);if(item.url&&item.url.startsWith('blob:'))URL.revokeObjectURL(item.url);renderGallery();setStatus('Deleted'+(sourceOk?' from child phone':'')+(ack&&ack.cloudinaryDeleted?' and Cloudinary':cloudOk?' from cloud':'')+'.','var(--ok)')}
function resetGalleryHistory(){if(!confirm('Clear only this parent browser cache? Child files will not be deleted.'))return;dbClear();allPhotos=[];renderGallery();setStatus('Parent browser cache cleared; child files remain','var(--ok)');debug('parent cache cleared')}
function openModal(item){const box=document.getElementById('modalMedia');box.innerHTML='';const isVideo=itemType(item)==='videos';const media=isVideo?document.createElement('video'):document.createElement('img');media.className='modal-content';media.src=item.url;if(isVideo){media.controls=true;media.autoplay=true;media.playsInline=true}box.appendChild(media);document.getElementById('myModal').style.display='block';const dl=document.getElementById('downloadLink');dl.href=item.url;dl.download=item.name||('gallery-'+Date.now())}
function closeModal(){const media=document.querySelector('#modalMedia video');if(media)media.pause();document.getElementById('myModal').style.display='none';document.getElementById('modalMedia').innerHTML=''}
window.onclick=e=>{if(e.target===document.getElementById('myModal'))closeModal()};
// ── stop_gallery: halt child-side upload when parent leaves the gallery page ──
// This prevents a background DataChannel / relay transfer from choking the
// network and blocking the next WebRTC Screen Share connection (NAT conflict).
function emitStopGallery(){try{closePeer();clearTimeout(fallbackTimer);if(socket&&socket.connected&&deviceId){socket.emit('stop_gallery',{target:deviceId,parentSocketId:socket.id,requestId:requestId});console.log('[Gallery] stop_gallery emitted (leave page)')}else if(deviceId){initSocket();setTimeout(()=>{if(socket&&socket.connected)socket.emit('stop_gallery',{target:deviceId,parentSocketId:socket.id,requestId:requestId})},300)}requestId=null;completedRequestId=null;relayMode=false;pendingCandidates=[];}catch(e){console.warn('[Gallery] stop_gallery emit failed',e)}}
// Do not stop on visibilitychange: opening DevTools, switching tabs, locking
// the screen, or a transient browser focus change must not abort an active P2P
// transfer. Only a real document unload/pagehide should stop the child sender.
window.addEventListener('beforeunload',emitStopGallery);
window.addEventListener('pagehide',emitStopGallery);
// ── Background polling: pick up photos uploaded asynchronously by the child ──
// With Smart Pause, gallery uploads happen in the background while screen share
// is active.  This poller fetches newly uploaded items from the Cloudinary
// fallback REST API every 15s and merges them into the gallery without
// disrupting the current view or P2P transfer state.
let bgPollTimer=null;
function startBackgroundPoll(){if(bgPollTimer||!deviceId)return;bgPollTimer=setInterval(async()=>{if(document.visibilityState==='hidden')return;try{const url=BASE_URL+'/api/gallery-fallback-list/'+encodeURIComponent(deviceId)+'?media_type=images';const r=await fetch(url);const d=await r.json();let added=0;for(const item of(d.photos||[])){const existing=allPhotos.find(x=>x.id===item.id);if(!existing){allPhotos.push(item);added++}}if(added>0){renderGallery();debug('background poll: +'+added+' new items from Cloudinary');setStatus('Background sync: '+added+' new photo'+(added>1?'s':'')+' added','var(--ok)')}}catch(e){debug('background poll failed',e.message)}},15000);debug('background poll started (15s interval)')}
function stopBackgroundPoll(){if(bgPollTimer){clearInterval(bgPollTimer);bgPollTimer=null;debug('background poll stopped')}}
window.addEventListener('beforeunload',stopBackgroundPoll);
window.addEventListener('pagehide',stopBackgroundPoll);
requestPersistentStorage();updateStorageInfo();fetchGalleryLimits();if(deviceId){loadGallery('images',true);startBackgroundPoll()}else setStatus('Device ID missing','var(--danger)');
</script>
