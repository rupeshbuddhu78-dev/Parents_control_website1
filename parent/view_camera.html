<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Camera Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
<style>
:root {
    --bg: #0a0a0f;
    --surface: #16161e;
    --surface2: #1e1e2a;
    --green: #00e676;
    --green-dim: rgba(0,230,118,0.15);
    --red: #ff3d3d;
    --red-dim: rgba(255,61,61,0.15);
    --blue: #448aff;
    --blue-dim: rgba(68,138,255,0.15);
    --amber: #ffab00;
    --amber-dim: rgba(255,171,0,0.15);
    --text: #eaeaea;
    --text-dim: #8888a0;
    --radius: 16px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: var(--text);
}

.app {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

@media (min-width: 501px) {
    .app {
        max-width: 420px;
        height: 90vh;
        max-height: 860px;
        border-radius: 28px;
        box-shadow: 0 0 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
        border: 3px solid #222;
    }
}

/* ── HEADER ── */
.header {
    flex-shrink: 0;
    padding: 14px 18px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--green-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.header-icon.off {
    background: var(--red-dim);
}

.title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
}

.subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
}

.status-badge {
    font-size: 10px;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
}

.status-badge.offline {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255,61,61,0.3);
}

.status-badge.live {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(0,230,118,0.3);
    animation: pulse-live 2s infinite;
}

@keyframes pulse-live {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,230,118,0.3); }
    50% { box-shadow: 0 0 0 6px rgba(0,230,118,0); }
}

/* ── VIDEO AREA ── */
.video-box {
    flex-grow: 1;
    background: #000;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.video-placeholder {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text-dim);
    pointer-events: none;
    transition: opacity 0.3s;
}

.video-placeholder.hidden { opacity: 0; }

.placeholder-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border: 2px dashed rgba(255,255,255,0.1);
}

.placeholder-text {
    font-size: 13px;
    font-weight: 500;
}

/* Camera direction indicator */
.cam-direction {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}

.cam-direction.show { opacity: 1; }

/* ── CONTROLS ── */
.controls {
    flex-shrink: 0;
    padding: 16px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--surface) 0%, var(--surface2) 100%);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.controls-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

/* Main action buttons (Start / Stop) */
.btn-action {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 16px 0;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
}

.btn-action:active {
    transform: scale(0.96);
}

.btn-action::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 60%);
    pointer-events: none;
}

.btn-start {
    background: linear-gradient(135deg, #00c853, #00e676);
    color: #003d00;
    box-shadow: 0 4px 20px rgba(0,230,118,0.25);
}

.btn-start:disabled {
    background: linear-gradient(135deg, #1a3a1a, #1e4a1e);
    color: #4a7a4a;
    box-shadow: none;
    cursor: default;
}

.btn-stop {
    background: linear-gradient(135deg, #d32f2f, #ff3d3d);
    box-shadow: 0 4px 20px rgba(255,61,61,0.2);
}

.btn-stop:disabled {
    background: linear-gradient(135deg, #3a1a1a, #4a1e1e);
    color: #7a4a4a;
    box-shadow: none;
    cursor: default;
}

/* Icon buttons row */
.icon-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.btn-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    position: relative;
}

.btn-icon:active {
    transform: scale(0.9);
}

.btn-icon.switch-cam {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-dim);
}

.btn-icon.speaker {
    border-color: var(--amber);
    color: var(--amber);
    background: var(--amber-dim);
}

.btn-icon.speaker.muted {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-dim);
    opacity: 0.8;
}

.btn-icon-label {
    position: absolute;
    bottom: -18px;
    font-size: 9px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon" id="headerIcon">📷</div>
            <div>
                <div class="title">Camera Monitor</div>
                <div class="subtitle" id="camLabel">Front Camera</div>
            </div>
        </div>
        <span id="status" class="status-badge offline">OFFLINE</span>
    </div>

    <!-- VIDEO -->
    <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="video-placeholder" id="placeholder">
            <div class="placeholder-icon">📹</div>
            <div class="placeholder-text">Tap Start to begin live stream</div>
        </div>
        <div class="cam-direction" id="camDirection">🔄 Switching...</div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <!-- Start / Stop row -->
        <div class="controls-row">
            <button class="btn-action btn-start" id="btnStart" onclick="startCamera()">
                <span>▶</span> Start
            </button>
            <button class="btn-action btn-stop" id="btnStop" onclick="stopCamera()" disabled>
                <span>⏹</span> Stop
            </button>
        </div>
        <!-- Icon buttons row -->
        <div class="icon-btns">
            <button class="btn-icon switch-cam" onclick="switchCamera()" title="Switch Camera">
                🔄
                <span class="btn-icon-label">Switch</span>
            </button>
            <button class="btn-icon speaker" id="btnSpeaker" onclick="toggleSpeaker()" title="Speaker / Mic">
                🔊
                <span class="btn-icon-label">Speaker</span>
            </button>
        </div>
    </div>

</div>

<script>
/* ================= AUTH CHECK ================= */
(function(){
    var t = localStorage.getItem("access_token");
    if(!t){ window.location.href='/login'; return; }
    try {
        var u = JSON.parse(localStorage.getItem("user") || "{}");
        if(!u.email){ window.location.href='/login'; }
    } catch(e){ window.location.href='/login'; }
})();

/* ================= CONFIG ================= */
const SERVER = "https://parents-control-website-lyqz.onrender.com";
const params = new URLSearchParams(window.location.search);
let DEVICE_ID = params.get("id");
if(!DEVICE_ID){
    DEVICE_ID = localStorage.getItem("savedDeviceId");
}
if(!DEVICE_ID){
    console.log("Device ID missing in URL or LocalStorage");
}

/* ================= STATE ================= */
let socket;
let pc;
let isLive = false;
let speakerOn = true;
let isFrontCamera = true;

const config = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turns:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:relay1.expressturn.com:3478', username: 'efree', credential: 'efree' },
        { urls: 'turn:relay1.expressturn.com:3478?transport=tcp', username: 'efree', credential: 'efree' }
    ]
};

/* ================= SOCKET ================= */
socket = io(SERVER);

socket.on("connect", ()=>{
    console.log("[Socket] CONNECTED id=", socket.id);
    socket.emit("join-room","ADMIN");
    if (DEVICE_ID) {
        socket.emit("join-room", DEVICE_ID);
        console.log("[Socket] joined ADMIN +", DEVICE_ID);
    }
});
socket.on("disconnect", (reason) => console.warn("[Socket] DISCONNECTED", reason));
socket.on("connect_error", (err) => console.error("[Socket] CONNECT_ERROR", err));

/* ================= OFFER ================= */
socket.on("offer", async (data)=>{
    console.log("[WebRTC] offer received, sdp length=", data && data.sdp ? data.sdp.length : 0);

    if (pc) { try { pc.close(); } catch(e){} }
    pc = new RTCPeerConnection(config);

    pc.ontrack = (event) => {
        const video = document.getElementById("remoteVideo");
        console.log("[WebRTC] ontrack kind=" + (event.track && event.track.kind)
            + " streams=" + (event.streams ? event.streams.length : 0));

        if (event.streams && event.streams[0]) {
            video.srcObject = event.streams[0];
        } else {
            let stream = video.srcObject;
            if (!(stream instanceof MediaStream)) stream = new MediaStream();
            stream.addTrack(event.track);
            video.srcObject = stream;
        }

        video.muted = false;
        video.volume = speakerOn ? 1.0 : 0;
        try {
            const st = video.srcObject;
            if (st && st.getAudioTracks) {
                const ats = st.getAudioTracks();
                console.log("[WebRTC] audioTracks=" + ats.length);
                ats.forEach(t => { t.enabled = speakerOn; });
            }
        } catch (e) { console.warn(e); }
        video.playsInline = true;
        video.play().then(() => {
            console.log("[WebRTC] play() OK");
            setLive(true);
        }).catch(e => {
            console.warn("[WebRTC] Autoplay blocked, click page once:", e);
            const unlock = () => {
                video.muted = false;
                video.play().catch(()=>{});
                document.removeEventListener("click", unlock);
            };
            document.addEventListener("click", unlock);
        });
    };

    pc.onicecandidate = (e)=>{
        if(e.candidate){
            socket.emit("candidate",{
                target: DEVICE_ID,
                candidate: e.candidate.candidate,
                sdpMid: e.candidate.sdpMid,
                sdpMLineIndex: e.candidate.sdpMLineIndex
            });
        }
    };

    await pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: data.sdp }));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);

    socket.emit("answer",{
        target: DEVICE_ID,
        sdp: ans.sdp
    });
});

/* ================= ICE ================= */
socket.on("candidate", async d=>{
    if(pc){
        await pc.addIceCandidate(new RTCIceCandidate({
            candidate: d.candidate,
            sdpMid: d.sdpMid,
            sdpMLineIndex: d.sdpMLineIndex
        }));
    }
});

/* ================= BUTTONS ================= */

function startCamera(){
    if(!DEVICE_ID) { alert("Device ID nahi mila! URL me ?id=YOUR_ID lagayein."); return; }
    console.log("[UI] start_video ->", DEVICE_ID);
    socket.emit("send-command",{ token: (localStorage.getItem('access_token')||''), 
        targetId: DEVICE_ID,
        command: "start_video"
    });
    // Update UI optimistically
    document.getElementById("btnStart").disabled = true;
    document.getElementById("btnStop").disabled = false;
}

function stopCamera(){
    if(!DEVICE_ID) return;
    socket.emit("send-command",{ token: (localStorage.getItem('access_token')||''), 
        targetId: DEVICE_ID,
        command: "stop_video"
    });

    const v = document.getElementById("remoteVideo");
    v.srcObject = null;
    if(pc){ pc.close(); pc = null; }

    setLive(false);
    document.getElementById("btnStart").disabled = false;
    document.getElementById("btnStop").disabled = true;
}

function switchCamera(){
    if(!DEVICE_ID || !isLive) return;

    // Show switching indicator
    const indicator = document.getElementById("camDirection");
    indicator.classList.add("show");

    // Toggle front/back state
    isFrontCamera = !isFrontCamera;
    document.getElementById("camLabel").textContent = isFrontCamera ? "Front Camera" : "Back Camera";

    // Send switch command via send-command (reliable through server relay)
    socket.emit("send-command", { token: (localStorage.getItem('access_token')||''), 
        targetId: DEVICE_ID,
        command: "switch_camera"
    });

    // Also send via direct switch-camera event (for backward compat)
    socket.emit("switch-camera", { target: DEVICE_ID });

    // Hide indicator after delay
    setTimeout(() => {
        indicator.classList.remove("show");
    }, 1500);
}

/* ================= SPEAKER / MIC MUTE ================= */
function toggleSpeaker(){
    speakerOn = !speakerOn;
    const video = document.getElementById("remoteVideo");
    const btn = document.getElementById("btnSpeaker");

    // Toggle local audio
    if (video) {
        video.muted = !speakerOn;
        video.volume = speakerOn ? 1.0 : 0;
        // Also disable audio tracks locally
        try {
            const st = video.srcObject;
            if (st && st.getAudioTracks) {
                st.getAudioTracks().forEach(t => { t.enabled = speakerOn; });
            }
        } catch(e) {}
    }

    // Update button UI
    btn.textContent = speakerOn ? "🔊" : "🔇";
    btn.classList.toggle("muted", !speakerOn);

    // Send mic mute/unmute command to child device
    if(DEVICE_ID){
        const micCmd = speakerOn ? "unmute_mic" : "mute_mic";
        socket.emit("send-command", { token: (localStorage.getItem('access_token')||''), 
            targetId: DEVICE_ID,
            command: micCmd
        });
        console.log("[Audio] speaker", speakerOn ? "ON" : "MUTED", "-> sent", micCmd, "to child");
    }
}

/* ================= UI HELPERS ================= */
function setLive(live){
    isLive = live;
    const s = document.getElementById("status");
    const icon = document.getElementById("headerIcon");
    const ph = document.getElementById("placeholder");

    s.textContent = live ? "LIVE" : "OFFLINE";
    s.className = "status-badge " + (live ? "live" : "offline");

    icon.className = "header-icon" + (live ? "" : " off");
    ph.classList.toggle("hidden", live);
}

/* ================= AUTO-STOP ON EXIT ================= */
function emitStopCameraOnExit() {
    try {
        if (DEVICE_ID && socket && socket.connected) {
            socket.emit("send-command", { token: (localStorage.getItem('access_token')||''), 
                targetId: DEVICE_ID,
                command: "stop_video"
            });
        }
        if (pc) { try { pc.close(); } catch(e){} pc = null; }
        const v = document.getElementById("remoteVideo");
        if (v) v.srcObject = null;
    } catch (e) {
        console.warn('[Camera] auto-stop emit failed', e);
    }
}
window.addEventListener('beforeunload', emitStopCameraOnExit);
window.addEventListener('pagehide', emitStopCameraOnExit);
</script>

</body>
</html>
