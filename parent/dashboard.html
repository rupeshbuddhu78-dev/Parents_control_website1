<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #fceef5 0%, #e0c3fc 50%, #8ec5fc 100%);
            --glass-bg: rgba(255, 245, 250, 0.65);
            --card-bg: rgba(255, 250, 252, 0.95);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --primary: #0066ff;
            --online: #34c759;
            --offline: #ff3b30;
            --warning: #ff9500;
            --input-bg: #f2f2f7;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --glass-bg: rgba(15, 15, 20, 0.55);
            --card-bg: rgba(30, 30, 35, 0.95);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --primary: #00f3ff;
            --online: #00e676;
            --offline: #ff4757;
            --warning: #ff9800;
            --input-bg: #2a2a35;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
        }
        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .top-bar h2 { font-size: 1.2rem; font-weight: 800; }
        .top-bar .user-info { display: flex; align-items: center; gap: 12px; }
        .top-bar .user-name { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .top-bar .user-id { font-size: 0.7rem; color: var(--text-muted); opacity: 0.7; font-family: monospace; }
        .btn-logout {
            background: rgba(255, 59, 48, 0.1);
            color: var(--offline);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .btn-add-device-top {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add-device-top:hover { opacity: 0.9; }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .device-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .device-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .device-card .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .device-card .device-name { font-weight: 700; font-size: 1rem; }
        .device-card .device-id { font-size: 0.75rem; color: var(--text-muted); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.online { background: var(--online); box-shadow: 0 0 8px var(--online); }
        .status-dot.offline { background: var(--offline); }
        .device-card .device-meta { display: flex; gap: 12px; margin-top: 10px; }
        .device-card .meta-item { font-size: 0.75rem; color: var(--text-muted); }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        .empty-state i { font-size: 3rem; color: var(--text-muted); margin-bottom: 16px; }
        .empty-state h3 { margin-bottom: 8px; }
        .empty-state p { color: var(--text-muted); font-size: 0.9rem; }
        .add-device-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .subscription-banner {
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.1), rgba(175, 82, 222, 0.1));
            border: 1px solid rgba(0, 102, 255, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subscription-banner .sub-text { font-size: 0.85rem; font-weight: 600; }
        .subscription-banner .sub-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--glass-border);
        }
        .modal-content h3 { margin-bottom: 20px; }
        .modal-content input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            margin-bottom: 16px;
        }
        .modal-content input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
        .modal-actions .btn-cancel { background: var(--input-bg); color: var(--text-main); }
        .modal-actions .btn-confirm { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2><i class="fa-solid fa-shield-halved"></i> My Devices</h2>
        <div class="user-info">
            <div style="text-align: right;">
                <div class="user-name" id="userName">Loading...</div>
                <div class="user-id" id="userId"></div>
            </div>
            <button class="btn-add-device-top" onclick="showAddDevice()"><i class="fa-solid fa-plus"></i> Add Device</button>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Premium Status Section -->
        <div id="premiumStatusSection" style="display:none; margin-bottom: 16px;">
            <!-- Active Premium -->
            <div id="premiumActive" style="display:none; background: linear-gradient(135deg, rgba(0, 200, 83, 0.1), rgba(0, 230, 118, 0.1)); border: 1px solid rgba(0, 200, 83, 0.3); border-radius: 16px; padding: 16px 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #00c853, #00e676); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-crown" style="color: white; font-size: 1.1rem;"></i>
                        </div>
                        <div>
                            <div style="font-size: 0.9rem; font-weight: 700; color: #00c853;">Premium Active</div>
                            <div id="premiumPlanName" style="font-size: 0.75rem; color: var(--text-muted);">Plan: --</div>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div id="premiumExpiry" style="font-size: 0.75rem; color: var(--text-muted);">Expires: --</div>
                        <a href="/plans" style="font-size: 0.75rem; color: var(--primary); font-weight: 600; text-decoration: none;">Manage Plan →</a>
                    </div>
                </div>
            </div>
            
            <!-- No Premium -->
            <div id="premiumInactive" style="display:none; background: linear-gradient(135deg, rgba(0, 102, 255, 0.1), rgba(175, 82, 222, 0.1)); border: 1px solid rgba(0, 102, 255, 0.2); border-radius: 16px; padding: 16px 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #0066ff, #af52de); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-crown" style="color: white; font-size: 1.1rem;"></i>
                        </div>
                        <div>
                            <div style="font-size: 0.9rem; font-weight: 700;">Upgrade to Premium</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">Unlock more devices & features</div>
                        </div>
                    </div>
                    <button onclick="window.location.href='/plans'" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.8rem;">
                        View Plans
                    </button>
                </div>
            </div>
        </div>

        <div id="deviceGrid" class="device-grid"></div>

        <div id="emptyState" class="empty-state" style="display:none;">
            <i class="fa-solid fa-mobile-screen"></i>
            <h3>No Devices Yet</h3>
            <p>Install the child app on a device and pair it to start monitoring.</p>
            <button class="add-device-btn" onclick="showAddDevice()"><i class="fa-solid fa-plus"></i> Add Device</button>
        </div>
    </div>

    <!-- Add Device Modal -->
    <div id="addDeviceModal" class="modal-overlay">
        <div class="modal-content">
            <h3><i class="fa-solid fa-plus-circle"></i> Add Device</h3>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px;">Enter the Device ID shown on the child app.</p>
            <input type="text" id="newDeviceId" placeholder="e.g. ABC12345" autocomplete="off">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAddDevice()">Cancel</button>
                <button class="btn-confirm" onclick="addDevice()">Add</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;

        // Auth check
        (function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href='/login'; return; }
            try {
                currentUser = JSON.parse(localStorage.getItem('user') || '{}');
                if (currentUser.role === 'ADMIN') { window.location.href='/admin-dashboard'; return; }
                document.getElementById('userName').textContent = currentUser.name || currentUser.email || 'User';
                document.getElementById('userId').textContent = 'ID: ' + (currentUser.email || currentUser._id || 'N/A');
            } catch (e) { window.location.href='/login'; }
        })();

        async function loadDashboard() {
            try {
                // Check subscription
                const subRes = await authFetch('/api/subscription/status');
                if (subRes.ok) {
                    const subData = await subRes.json();
                    const premiumSection = document.getElementById('premiumStatusSection');
                    const premiumActive = document.getElementById('premiumActive');
                    const premiumInactive = document.getElementById('premiumInactive');
                    
                    premiumSection.style.display = 'block';
                    
                    if (subData.hasActiveSubscription && subData.subscription) {
                        // Show active premium
                        premiumActive.style.display = 'block';
                        premiumInactive.style.display = 'none';
                        
                        const plan = subData.subscription.planId;
                        const planName = plan ? plan.name : 'Premium';
                        const expiryDate = subData.subscription.expiryDate 
                            ? new Date(subData.subscription.expiryDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
                            : '--';
                        
                        document.getElementById('premiumPlanName').textContent = `Plan: ${planName}`;
                        document.getElementById('premiumExpiry').textContent = `Expires: ${expiryDate}`;
                    } else {
                        // Show upgrade prompt
                        premiumActive.style.display = 'none';
                        premiumInactive.style.display = 'flex';
                    }
                }
            } catch (e) {}

            // Load devices
            const devices = currentUser.devices || [];
            const grid = document.getElementById('deviceGrid');
            const empty = document.getElementById('emptyState');

            if (devices.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            for (const deviceId of devices) {
                try {
                    const res = await fetch(`${API_BASE}/api/device-status/${encodeURIComponent(deviceId)}`, { cache: 'no-store' });
                    const data = await res.json();
                    const card = document.createElement('div');
                    card.className = 'device-card';
                    card.onclick = () => openDevice(deviceId);
                    card.innerHTML = `
                        <div class="device-header">
                            <div>
                                <div class="device-name">${data.model || deviceId}</div>
                                <div class="device-id">${deviceId}</div>
                            </div>
                            <div class="status-dot ${data.isOnline ? 'online' : 'offline'}"></div>
                        </div>
                        <div class="device-meta">
                            <span class="meta-item"><i class="fa-solid fa-battery-half"></i> ${data.battery || 0}%</span>
                            <span class="meta-item"><i class="fa-solid fa-android"></i> ${data.version || '--'}</span>
                            <span class="meta-item">${data.isOnline ? 'Online' : 'Offline'}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                } catch (e) {
                    // Show card even if status fetch fails
                    const card = document.createElement('div');
                    card.className = 'device-card';
                    card.onclick = () => openDevice(deviceId);
                    card.innerHTML = `
                        <div class="device-header">
                            <div><div class="device-name">${deviceId}</div><div class="device-id">Status unknown</div></div>
                            <div class="status-dot offline"></div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            }
        }

        function openDevice(deviceId) {
            localStorage.setItem('monitoring_id', deviceId);
            window.location.href='/index';
        }

        function showAddDevice() {
            document.getElementById('addDeviceModal').style.display = 'flex';
        }

        function closeAddDevice() {
            document.getElementById('addDeviceModal').style.display = 'none';
            document.getElementById('newDeviceId').value = '';
        }

        async function addDevice() {
            const deviceId = document.getElementById('newDeviceId').value.trim().toUpperCase();
            if (!deviceId) return alert('Enter a device ID');

            try {
                const res = await authFetch('/api/parent/add-device', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');

                // Update local user
                if (!currentUser.devices) currentUser.devices = [];
                currentUser.devices.push(deviceId);
                localStorage.setItem('user', JSON.stringify(currentUser));
                
                // Set device ID and redirect to device dashboard
                localStorage.setItem('monitoring_id', deviceId);
                window.location.href = '/index';
            } catch (e) {
                alert(e.message);
            }
        }

        async function authFetch(url, options = {}) {
            const token = localStorage.getItem('access_token');
            const headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
            const res = await fetch(API_BASE + url, { ...options, headers });
            if (res.status === 401) {
                // Try refresh
                const refreshed = await tryRefresh();
                if (refreshed) {
                    const newToken = localStorage.getItem('access_token');
                    headers.Authorization = `Bearer ${newToken}`;
                    return fetch(API_BASE + url, { ...options, headers });
                }
                window.location.href='/login';
            }
            return res;
        }

        async function tryRefresh() {
            try {
                const refreshToken = localStorage.getItem('refresh_token');
                if (!refreshToken) return false;
                const res = await fetch(`${API_BASE}/api/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken }),
                });
                if (!res.ok) return false;
                const data = await res.json();
                localStorage.setItem('access_token', data.accessToken);
                localStorage.setItem('refresh_token', data.refreshToken);
                return true;
            } catch (e) { return false; }
        }

        async function logout() {
            try {
                const token = localStorage.getItem('access_token');
                const refreshToken = localStorage.getItem('refresh_token');
                await fetch(`${API_BASE}/api/auth/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ refreshToken }),
                });
            } catch (e) {}
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.href='/login';
        }

        loadDashboard();
    </script>
</body>
</html>
