<script>
/* Auth fetch: attach JWT + auto-refresh on 401 (fixes mid-session logout / dead buttons) */
(function(){
  try {
    var F = window.fetch;
    var refreshing = null;
    function getAccess(){ try { return localStorage.getItem('access_token')||''; } catch(e){ return ''; } }
    function getRefresh(){ try { return localStorage.getItem('refresh_token')||''; } catch(e){ return ''; } }
    function setTokens(a,r){
      try {
        if(a) localStorage.setItem('access_token', a);
        if(r) localStorage.setItem('refresh_token', r);
      } catch(e){}
    }
    function apiBaseFrom(u){
      try {
        if(/^https?:\/\//i.test(u)){ var x=new URL(u); return x.origin; }
      } catch(e){}
      return (window.API_BASE||window.SERVER_URL||window.BASE_URL||location.origin||'').replace(/\/$/,'');
    }
    function doRefresh(base){
      if(refreshing) return refreshing;
      var rt = getRefresh();
      if(!rt) return Promise.reject(new Error('no refresh'));
      refreshing = F.call(window, (base||location.origin) + '/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: rt })
      }).then(function(res){
        return res.json().then(function(d){ return { ok: res.ok, d: d }; });
      }).then(function(x){
        refreshing = null;
        if(!x.ok || !(x.d.accessToken||x.d.access_token)) throw new Error('refresh failed');
        var a = x.d.accessToken || x.d.access_token;
        var r = x.d.refreshToken || x.d.refresh_token || rt;
        setTokens(a, r);
        return a;
      }).catch(function(e){ refreshing = null; throw e; });
      return refreshing;
    }
    window.fetch = function(input, init){
      init = init || {};
      var url = typeof input === 'string' ? input : ((input && input.url) || '');
      var isApi = url.indexOf('/api/') !== -1;
      var isRefresh = url.indexOf('/api/auth/refresh') !== -1;
      if(isApi && !isRefresh){
        try {
          var t = getAccess();
          if(t){
            var h = new Headers(init.headers || {});
            if(!h.has('Authorization')) h.set('Authorization', 'Bearer ' + t);
            init.headers = h;
          }
        } catch(e){}
      }
      return F.call(this, input, init).then(function(res){
        if(!isApi || isRefresh || res.status !== 401) return res;
        var base = apiBaseFrom(url);
        return doRefresh(base).then(function(newTok){
          var h2 = new Headers(init.headers || {});
          h2.set('Authorization', 'Bearer ' + newTok);
          init.headers = h2;
          return F.call(window, input, init);
        }).catch(function(){
          // refresh failed — only clear if both tokens bad; avoid aggressive logout loops
          return res;
        });
      });
    };
  } catch(e){}
})();
</script>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;

        // Auth check
        (function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href='/login'; return; }
            try {
                currentUser = JSON.parse(localStorage.getItem('user') || '{}');
                if (currentUser.role === 'ADMIN') { window.location.href='/admin-dashboard'; return; }
                document.getElementById('userName').textContent = currentUser.name || currentUser.email || 'User';
                document.getElementById('userId').textContent = 'ID: ' + (currentUser.email || currentUser._id || 'N/A');
            } catch (e) { window.location.href='/login'; }
        })();

        async function loadDashboard() {
            // REFRESH_DEVICES_FROM_SERVER — admin delete ke baad localStorage purana na dikhe
            try {
                const meRes = await fetch((window.API_BASE||window.SERVER_URL||'') + '/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('access_token')||'') }
                });
                if (meRes.ok) {
                    const meData = await meRes.json();
                    if (meData.user) {
                        currentUser = meData.user;
                        localStorage.setItem('user', JSON.stringify(meData.user));
                    }
                }
            } catch (e) { console.warn('me refresh', e); }

            try {
                const devRes = await fetch((window.API_BASE||window.SERVER_URL||'') + '/api/parent/devices', {
                    headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('access_token')||'') },
                    cache: 'no-store'
                });
                if (devRes.ok) {
                    const devData = await devRes.json();
                    if (Array.isArray(devData.devices)) {
                        if (!currentUser) currentUser = JSON.parse(localStorage.getItem('user')||'{}');
                        currentUser.devices = devData.devices;
                        localStorage.setItem('user', JSON.stringify(currentUser));
                        // Clear monitoring_id if deleted
                        var mid = (localStorage.getItem('monitoring_id')||'').toUpperCase();
                        var up = devData.devices.map(function(d){return String(d).toUpperCase();});
                        if (mid && up.indexOf(mid) < 0) localStorage.removeItem('monitoring_id');
                    }
                }
            } catch (e2) { console.warn('devices refresh', e2); }


            try {
                // Check subscription
                const subRes = await authFetch('/api/subscription/status');
                if (subRes.ok) {
                    const subData = await subRes.json();
                    const premiumSection = document.getElementById('premiumStatusSection');
                    const premiumActive = document.getElementById('premiumActive');
                    const premiumInactive = document.getElementById('premiumInactive');
                    
                    premiumSection.style.display = 'block';
                    
                    if (subData.hasActiveSubscription && subData.subscription) {
                        // Show active premium
                        premiumActive.style.display = 'block';
                        premiumInactive.style.display = 'none';
                        
                        const plan = subData.subscription.planId;
                        const planName = plan ? plan.name : 'Premium';
                        const expiryDate = subData.subscription.expiryDate 
                            ? new Date(subData.subscription.expiryDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
                            : '--';
                        
                        document.getElementById('premiumPlanName').textContent = `Plan: ${planName}`;
                        document.getElementById('premiumExpiry').textContent = `Expires: ${expiryDate}`;
                    } else {
                        // Show upgrade prompt
                        premiumActive.style.display = 'none';
                        premiumInactive.style.display = 'flex';
                    }
                }
            } catch (e) {}

            // Load devices
            const devices = currentUser.devices || [];
            const grid = document.getElementById('deviceGrid');
            const empty = document.getElementById('emptyState');

            if (devices.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            for (const deviceId of devices) {
                try {
                    const res = await fetch(`${API_BASE}/api/device-status/${encodeURIComponent(deviceId)}`, { cache: 'no-store' });
                    const data = await res.json();
                    const card = document.createElement('div');
                    card.className = 'device-card';
                    card.onclick = () => openDevice(deviceId);
                    card.innerHTML = `
                        <div class="device-header">
                            <div>
                                <div class="device-name">${data.model || deviceId}</div>
                                <div class="device-id">${deviceId}</div>
                            </div>
                            <div class="status-dot ${data.isOnline ? 'online' : 'offline'}"></div>
                        </div>
                        <div class="device-meta">
                            <span class="meta-item"><i class="fa-solid fa-battery-half"></i> ${data.battery != null ? data.battery : 0}%</span>
                            <span class="meta-item"><i class="fa-solid fa-android"></i> ${data.version || '--'}</span>
                            <span class="meta-item">${data.isOnline ? 'Online' : ('Offline' + (data.lastSeen ? ' · ' + new Date(data.lastSeen).toLocaleString() : ''))}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                } catch (e) {
                    // Show card even if status fetch fails
                    const card = document.createElement('div');
                    card.className = 'device-card';
                    card.onclick = () => openDevice(deviceId);
                    card.innerHTML = `
                        <div class="device-header">
                            <div><div class="device-name">${deviceId}</div><div class="device-id">Status unknown</div></div>
                            <div class="status-dot offline"></div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            }
        }

        function openDevice(deviceId) {
            localStorage.setItem('monitoring_id', deviceId);
            window.location.href='/index';
        }

        function showAddDevice() {
            document.getElementById('addDeviceModal').style.display = 'flex';
        }

        function closeAddDevice() {
            document.getElementById('addDeviceModal').style.display = 'none';
            document.getElementById('newDeviceId').value = '';
        }

        async function addDevice() {
            const deviceId = document.getElementById('newDeviceId').value.trim().toUpperCase();
            if (!deviceId) return alert('Enter a device ID');

            try {
                const res = await authFetch('/api/parent/add-device', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');

                // Update local user
                if (!currentUser.devices) currentUser.devices = [];
                currentUser.devices.push(deviceId);
                localStorage.setItem('user', JSON.stringify(currentUser));
                
                // Set device ID and redirect to device dashboard
                localStorage.setItem('monitoring_id', deviceId);
                window.location.href = '/index';
            } catch (e) {
                alert(e.message);
            }
        }

        async function authFetch(url, options = {}) {
            const token = localStorage.getItem('access_token');
            const headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
            const res = await fetch(API_BASE + url, { ...options, headers });
            if (res.status === 401) {
                // Try refresh
                const refreshed = await tryRefresh();
                if (refreshed) {
                    const newToken = localStorage.getItem('access_token');
                    headers.Authorization = `Bearer ${newToken}`;
                    return fetch(API_BASE + url, { ...options, headers });
                }
                window.location.href='/login';
            }
            return res;
        }

        async function tryRefresh() {
            try {
                const refreshToken = localStorage.getItem('refresh_token');
                if (!refreshToken) return false;
                const res = await fetch(`${API_BASE}/api/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken }),
                });
                if (!res.ok) return false;
                const data = await res.json();
                localStorage.setItem('access_token', data.accessToken);
                localStorage.setItem('refresh_token', data.refreshToken);
                return true;
            } catch (e) { return false; }
        }

        async function logout() {
            try {
                const token = localStorage.getItem('access_token');
                const refreshToken = localStorage.getItem('refresh_token');
                await fetch(`${API_BASE}/api/auth/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ refreshToken }),
                });
            } catch (e) {}
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.href='/login';
        }

        loadDashboard();
        // New device: refresh cards often for 90s so model/battery appear without manual refresh
        var _dashFast = setInterval(loadDashboard, 5000);
        setTimeout(function(){ clearInterval(_dashFast); }, 90000);


        // ── REAL-TIME STATUS via Socket.IO ──
        // Prevents status flicker by using server-pushed events
        (function setupDashboardSocket() {
            try {
                if (typeof io === 'undefined') {
                    var s = document.createElement('script');
                    s.src = '/socket.io/socket.io.js';
                    s.onload = function() { setupDashboardSocket(); };
                    document.head.appendChild(s);
                    return;
                }
                var sock = io(window.location.origin, { transports: ['websocket', 'polling'], reconnection: true, reconnectionDelay: 3000, timeout: 30000 });
                sock.on('connect', function() {
                    sock.emit('join-room', { room: 'ADMIN', role: 'parent' });
                    // Join all user device rooms for real-time status
                    var devices = (currentUser && currentUser.devices) || [];
                    devices.forEach(function(d) { sock.emit('join-room', { room: d, role: 'parent' }); });
                });
                // Debounce map: deviceId -> timer
                var _timers = {};
                sock.on('device-status', function(payload) {
                    if (!payload || !payload.deviceId) return;
                    var devId = String(payload.deviceId).toUpperCase();
                    clearTimeout(_timers[devId]);
                    if (payload.isOnline) {
                        // Online: update immediately
                        updateDeviceCardStatus(devId, true);
                    } else {
                        // Offline: wait 8s to avoid flicker
                        _timers[devId] = setTimeout(function() {
                            updateDeviceCardStatus(devId, false);
                        }, 8000);
                    }
                });
                // Re-fetch dashboard data periodically (backup)
                setInterval(function() { loadDashboard(); }, 60000);
            } catch (e) {}
        })();

        function updateDeviceCardStatus(deviceId, isOnline) {
            var cards = document.querySelectorAll('.device-card');
            cards.forEach(function(card) {
                var idEl = card.querySelector('.device-id');
                if (idEl && idEl.textContent.trim().toUpperCase() === deviceId) {
                    var dot = card.querySelector('.status-dot');
                    if (dot) {
                        dot.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
                    }
                    var metaItems = card.querySelectorAll('.meta-item');
                    metaItems.forEach(function(m) {
                        if (m.textContent.trim() === 'Online' || m.textContent.trim() === 'Offline') {
                            m.textContent = isOnline ? 'Online' : 'Offline';
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
